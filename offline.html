<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a2118">
<meta name="robots" content="noindex, nofollow">
<title>MySavdo — нет соединения</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    min-height:100dvh;padding:32px calc(24px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    padding-top:calc(32px + env(safe-area-inset-top));
    background:radial-gradient(120% 120% at 50% 0%, #123626 0%, #0a2118 65%);
    color:#f3e8cc;font-family:system-ui,-apple-system,'Segoe UI',Inter,sans-serif;text-align:center;
  }
  .mark{width:76px;height:76px;border-radius:20px;background:linear-gradient(180deg,#D9AE4E,#B8902B);
    display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(0,0,0,.35);}
  .mark svg{width:38px;height:38px;color:#0a2118;}
  h1{font-size:19px;margin:6px 0 0;font-weight:700;}
  p{font-size:14px;line-height:1.55;color:#c8cfc9;margin:0;max-width:320px;}
  button{
    margin-top:6px;padding:12px 26px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(180deg,#D9AE4E,#B8902B);color:#0a2118;font-weight:700;font-size:14.5px;
  }
  button:active{transform:translateY(1px);}
  .hint{font-size:12px;color:#7d8a83;}
</style>
</head>
<body>
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 8h10l-1 11a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2L7 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>
    </svg>
  </div>
  <h1>Нет соединения с интернетом</h1>
  <p>Проверьте Wi-Fi или мобильный интернет и попробуйте ещё раз — ваши заявки никуда не денутся.</p>
  <button id="retry" type="button">Повторить</button>
  <span class="hint">MySavdo работает онлайн — офлайн доступен только просмотр уже открытых экранов</span>
<script>
  document.getElementById('retry').addEventListener('click', () => location.reload());
  window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
